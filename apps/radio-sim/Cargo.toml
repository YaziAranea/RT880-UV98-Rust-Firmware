[package]
name = "uv98-radio-sim"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline interactive radio UI with explicitly synthetic spectrum"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
rfd = { version = "=0.17.2", default-features = false }
uv98-codeplug = { path = "../../crates/codeplug" }
uv98-ui-core = { path = "../../crates/ui-core" }
uv98-spectrum = { path = "../../crates/spectrum" }
uv98-radio-ui = { path = "../../crates/radio-ui" }
uv98-keys = { path = "../../crates/keys" }
uv98-display = { path = "../../crates/display" }
png = "=0.18.1"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
