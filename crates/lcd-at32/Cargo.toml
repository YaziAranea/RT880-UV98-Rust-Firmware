[package]
name = "uv98-lcd-at32"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experimental opt-in AT32F423 SPI3 LCD transport, derived from related RT880"

[features]
default = []
hardware = ["dep:at32f4xx-pac", "uv98-board-pins/hardware"]

[dependencies]
uv98-display = { path = "../display" }
uv98-board-pins = { path = "../board-pins" }
at32f4xx-pac = { version = "=0.4.0", default-features = false, features = ["at32f423"], optional = true }
