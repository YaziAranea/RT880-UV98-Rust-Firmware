[package]
name = "uv98-clock-profile"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
hardware = ["dep:at32f4xx-pac", "dep:cortex-m", "dep:uv98-display"]

[dependencies]
at32f4xx-pac = { version = "=0.4.0", default-features = false, features = ["at32f423"], optional = true }
cortex-m = { version = "=0.7.7", optional = true }
uv98-display = { path = "../display", optional = true }
