[package]
name = "uv98-handheld-ui"
version = "0.1.0"
edition = "2021"
publish = false
[features]
pa5-audio = []
voice-keyer = ["uv98-handheld-ui-state/voice-keyer"]
locale-ru = ["uv98-handheld-ui-state/locale-ru"]
locale-en = ["uv98-handheld-ui-state/locale-en"]
locale-de = ["uv98-handheld-ui-state/locale-de"]
locale-all = ["uv98-handheld-ui-state/locale-all"]

[dependencies]
uv98-band-plan = { path = "../band-plan" }
uv98-spectrum = { path = "../spectrum" }
uv98-keys = { path = "../keys" }
uv98-display = { path = "../display" }
uv98-codeplug = { path = "../codeplug" }
uv98-signaling = { path = "../signaling" }
uv98-handheld-ui-state = { path = "../handheld-ui-state" }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
uv98-handheld-ui-state = { path = "../handheld-ui-state", features = ["renderer-tests"] }
